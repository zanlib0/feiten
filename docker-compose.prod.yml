services:
  postgres:
    image: timescale/timescaledb:latest-pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: feiten
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: feiten_prod
    volumes:
      - postgres_prod_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feiten -d feiten_prod"]
      interval: 5s
      timeout: 5s
      retries: 10

  vernemq:
    image: vernemq/vernemq:2.1.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DOCKER_VERNEMQ_ACCEPT_EULA: "yes"
      DOCKER_VERNEMQ_ALLOW_ANONYMOUS: "off"
      DOCKER_VERNEMQ_LOG__CONSOLE__LEVEL: info
      DOCKER_VERNEMQ_PLUGINS__VMQ_PASSWD: "off"
      DOCKER_VERNEMQ_PLUGINS__VMQ_ACL: "off"
      DOCKER_VERNEMQ_PLUGINS__VMQ_DIVERSITY: "on"
      DOCKER_VERNEMQ_VMQ_DIVERSITY__AUTH_POSTGRES__ENABLED: "on"
      DOCKER_VERNEMQ_VMQ_DIVERSITY__POSTGRES__HOST: postgres
      DOCKER_VERNEMQ_VMQ_DIVERSITY__POSTGRES__PORT: "5432"
      DOCKER_VERNEMQ_VMQ_DIVERSITY__POSTGRES__USER: feiten
      DOCKER_VERNEMQ_VMQ_DIVERSITY__POSTGRES__PASSWORD: ${POSTGRES_PASSWORD}
      DOCKER_VERNEMQ_VMQ_DIVERSITY__POSTGRES__DATABASE: feiten_prod
      DOCKER_VERNEMQ_VMQ_DIVERSITY__POSTGRES__PASSWORD_HASH_METHOD: crypt
    # Plaintext listener — only bound to loopback. A host-level reverse proxy
    # (Caddy/Traefik/etc.) terminates TLS on 8883/mqtts and forwards here.
    ports:
      - "127.0.0.1:${MQTT_INTERNAL_PORT:-1883}:1883"
    volumes:
      - vernemq_prod_data:/vernemq/data

  backend:
    image: git.jerusalem.ovh/justinian/feiten-backend:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: ecto://feiten:${POSTGRES_PASSWORD}@postgres:5432/feiten_prod
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is required}
      PHX_HOST: ${PHX_HOST:-localhost}
      PORT: 4000
      POOL_SIZE: ${POOL_SIZE:-10}
      MQTT_HOST: vernemq
      MQTT_USERNAME: feiten_backend
      MQTT_PASSWORD: ${MQTT_BACKEND_PASSWORD:?MQTT_BACKEND_PASSWORD is required}
      MQTT_PUBLIC_SCHEME: ${MQTT_PUBLIC_SCHEME:-mqtts}
      MQTT_PUBLIC_HOST: ${MQTT_PUBLIC_HOST:?MQTT_PUBLIC_HOST is required}
      MQTT_PUBLIC_PORT: ${MQTT_PUBLIC_PORT:-8883}
    depends_on:
      postgres:
        condition: service_healthy
      vernemq:
        condition: service_started

  frontend:
    image: git.jerusalem.ovh/justinian/feiten-frontend:latest
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json
    environment:
      DOCKER_CONFIG: /
      WATCHTOWER_POLL_INTERVAL: 300
      WATCHTOWER_CLEANUP: "true"

volumes:
  postgres_prod_data:
  vernemq_prod_data:
